<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Воздушная экспедиция</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">✈</span><span>Воздушная экспедиция</span></div>
  </header>
  <main class="stage" style="max-width:720px;margin:0 auto;">
    <div class="proj-head" style="margin-bottom:28px;">
      <div class="eyebrow" style="font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);font-weight:800;margin-bottom:8px;">Командная экспедиция</div>
      <h1 style="font-size:clamp(32px,5vw,52px);line-height:1.05;">Северная станция</h1>
      <p style="font-size:clamp(16px,2vw,22px);color:var(--muted);max-width:52ch;margin-top:14px;">Деловая игра об авиационных решениях. Доставьте обязательный груз, сохраните резерв и скоординируйтесь с другими экипажами.</p>
    </div>
    <div style="display:grid;gap:14px;margin-top:28px;">
      <a class="btn primary" href="facilitator.html" style="text-decoration:none;display:grid;place-items:center;min-height:56px;">Пульт ведущего</a>
      <a class="btn" href="team.html" style="text-decoration:none;display:grid;place-items:center;min-height:56px;">Пульт команды</a>
      <a class="btn" href="screen.html" style="text-decoration:none;display:grid;place-items:center;min-height:56px;">Экран проектора</a>
    </div>
    <p style="color:var(--faint);font-size:14px;margin-top:28px;">Формат: 2–6 команд по 4–5 человек • 60–70 минут • одна миссия</p>
  </main>
</div>
</body>
</html>
